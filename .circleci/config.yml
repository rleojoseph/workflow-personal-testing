version: 2.1
orbs:
  node: circleci/node@4.3
  gh: circleci/github-cli@1.0.4
  macos: circleci/macos@2.3.6

parameters:
  run_integration_tests:
    type: boolean
    default: false

jobs:
  build:
    macos:
      xcode: 15.2.0
    parameters:
      run_integration_tests:
        type: boolean
    steps:
      - checkout
      - when:
          condition: << parameters.run_integration_tests >>
          steps:
            - run:
                name: Print integration test flag
                command: echo "Integration tests are enabled"
      - run:
          name: Default step
          command: |
            echo "This step always runs"
            echo "Workflow ID: $CIRCLE_WORKFLOW_ID"
            echo "Pipeline ID: $CIRCLE_PIPELINE_ID"
            echo "Build Number: $CIRCLE_BUILD_NUM"
            echo "Job Name: $CIRCLE_JOB"
            echo "Workflow Job ID: $CIRCLE_WORKFLOW_JOB_ID"

workflows:
  version: 2
  sample:
    jobs:
      - build:
          run_integration_tests: << pipeline.parameters.run_integration_tests >>
